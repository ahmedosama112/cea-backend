services:
  mysql:
    image: mysql:8.0
    container_name: cea-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cea
      MYSQL_USER: cea_user
      MYSQL_PASSWORD: changeme
      MYSQL_ROOT_PASSWORD: changeme_root
    ports:
      - "3306:3306"
    volumes:
      - cea_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pchangeme_root"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: cea-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  cea_mysql_data:
